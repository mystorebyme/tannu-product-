name: GitHub Pages preview

# GitHub Pages par static preview (browse karne ke liye).
# Poora site — cart, checkout, payment, order tracking, admin — Render par chalta hai
# (render.yaml). Pages par Node server nahi chalta, isliye yahan sirf static pages.

on:
  push:
    branches:
      - arena/f713eef1-tannu-product
      - main
    paths-ignore:
      - ".reviews-sync-trigger"
      - "database/seeds/reviews/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pages: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static preview
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: node scripts/pages/build-preview.mjs

      # Pages site enable karna repo admin ka kaam hai (GITHUB_TOKEN ke paas
      # wo right nahi hota). Isliye yeh step optional hai: fail ho to build
      # artifact download ke liye available rehta hai, workflow laal nahi hota.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-artifact@v4
        with:
          name: static-preview
          path: dist
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
