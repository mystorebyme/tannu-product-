name: GitHub Pages preview

# GitHub Pages par static preview (browse karne ke liye).
# Poora site — cart, checkout, payment, order tracking, admin — Render par chalta hai
# (render.yaml). Pages par Node server nahi chalta, isliye yahan sirf static pages.

on:
  push:
    branches:
      - arena/f713eef1-tannu-product
      - main
    paths-ignore:
      - ".reviews-sync-trigger"
      - "database/seeds/reviews/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static preview
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: node scripts/pages/build-preview.mjs

      - uses: actions/configure-pages@v5
        with:
          # Pages site pehli baar khud enable ho jaye (workflow build type)
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
